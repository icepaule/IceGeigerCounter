name: chirpstack
services:
  chirpstack:
    image: chirpstack/chirpstack:4
    command: -c /etc/chirpstack
    restart: unless-stopped
    volumes:
      - ./configuration/chirpstack:/etc/chirpstack:ro
    depends_on:
      - postgres
      - redis
    environment:
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - REDIS_HOST=redis
      - POSTGRESQL_HOST=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - API_SECRET=${API_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CHIRPSTACK_UI_PORT:-8180}:8080"
    mem_limit: 512m

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: unless-stopped
    ports:
      - "1700:1700/udp"
    volumes:
      - ./configuration/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge:ro
    environment:
      - INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      - INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      - INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/command/#
      - INTEGRATION__MQTT__AUTH__GENERIC__SERVERS=tcp://${MQTT_BROKER_HOST}:1883
      - INTEGRATION__MQTT__AUTH__GENERIC__USERNAME=${MQTT_USER}
      - INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD=${MQTT_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 128m

  chirpstack-rest-api:
    image: chirpstack/chirpstack-rest-api:4
    restart: unless-stopped
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure
    ports:
      - "127.0.0.1:8191:8090"
    depends_on:
      - chirpstack
    mem_limit: 64m

  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    volumes:
      - ./configuration/postgresql/initdb:/docker-entrypoint-initdb.d:ro
      - postgresqldata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=chirpstack
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=chirpstack
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - redisdata:/data
    mem_limit: 128m

volumes:
  postgresqldata:
  redisdata:
