name: Validate and build IceGeiger V2 artifacts
on:
  push:
    branches: [main]
    paths:
      - 'hardware/v2/**'
      - 'firmware/icegeiger_v2/**'
      - 'integrations/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/v2/**'
      - '.github/workflows/build-v2-artifacts.yml'
  workflow_dispatch:

concurrency:
  group: icegeiger-v2-cad-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb imagemagick python3-matplotlib nodejs
      - name: Validate existing project
        run: ./scripts/validate.sh
      - name: Build current Field Case v1.4
        run: |
          chmod +x ./scripts/build-field-case-v14.sh ./scripts/render-field-case-v14.sh
          ./scripts/build-field-case-v14.sh
          ./scripts/render-field-case-v14.sh
      - name: Commit generated Field Case v1.4 artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hardware/v2/field_case_v14/stl docs/v2/images/field_case_v14_*.png
          if git diff --cached --quiet; then
            echo 'Generated artifacts already current.'
          else
            git commit -m 'Generate Field Case v1.4 STL and previews [skip ci]'
            # validate.sh can rebuild historical artifacts; keep only the intentional v1.4 commit.
            git reset --hard HEAD
            git clean -fd
            git push origin HEAD:main
          fi
      - name: Upload current CAD artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: icegeiger-v2-field-case-v14
          path: |
            hardware/v2/field_case_v14/stl/
            docs/v2/images/field_case_v14_*.png
